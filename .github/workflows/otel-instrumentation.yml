name: OTEL Job Tracing - Spring Petclinic

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.DT_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token ${{ secrets.DT_API_TOKEN }}"
      OTEL_SERVICE_NAME: spring-petclinic-workflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install otel-cli
        run: |
          wget https://github.com/equinix-labs/otel-cli/releases/download/v0.4.1/otel-cli_0.4.1_linux_amd64.tar.gz
          tar -xzf otel-cli_0.4.1_linux_amd64.tar.gz
          chmod +x otel-cli
          sudo mv otel-cli /usr/local/bin/

      - name: Run Build and Test as a single Trace
        run: |
          # buat folder socket
          mkdir -p /tmp/otel

          # Start parent span
          otel-cli span start -n workflow-run -s spring-petclinic-workflow -a workflow.name=build-and-test --sockdir /tmp/otel &

          # Capture parent span PID
          PARENT_PID=$!

          # Child span: Build
          otel-cli span start -n build-app -p $PARENT_PID --sockdir /tmp/otel
          mvn clean package -DskipTests -Dcheckstyle.skip=true
          otel-cli span end --sockdir /tmp/otel

          # Child span: Test
          otel-cli span start -n run-tests -p $PARENT_PID  --sockdir /tmp/otel
          mvn test -Dcheckstyle.skip=true
          otel-cli span end --sockdir /tmp/otel

          # End parent span
          kill $PARENT_PID
