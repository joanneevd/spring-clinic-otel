name: OTEL Instrumented Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    env:
      OTEL_SERVICE_NAME: petclinic-workflow
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.DT_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token ${{ secrets.DT_API_TOKEN }}"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    steps:
      - name: Checkout code
        run: otel-cli exec -- git checkout $GITHUB_REF
          
      - name: Set up JDK 17
        run: otel-cli exec -- |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          
      - name: Cache Maven packages
        run: otel-cli exec -- |
          mkdir -p ~/.m2/repository
          echo "Maven cache ready"

      - name: Build with Maven
        run: otel-cli exec -- mvn clean package -DskipTests

      - name: Run Spring Petclinic with OTEL agent
        run: otel-cli exec -- |
          nohup java -javaagent:opentelemetry-javaagent.jar \
          -jar target/spring-petclinic-4.0.0-SNAPSHOT.jar > petclinic.log 2>&1 &
          echo $! > petclinic.pid
          sleep 30

      - name: Smoke test
        run: otel-cli exec -- curl -f http://10.12.160.115:8080/ || exit 1

      - name: Stop Spring Petclinic
        if: always()
        run: otel-cli exec -- |
          if [ -f petclinic.pid ]; then
            kill $(cat petclinic.pid) || true
            rm petclinic.pid
          fi
