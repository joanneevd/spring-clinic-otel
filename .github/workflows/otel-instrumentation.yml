name: OTEL Job Tracing - Spring Petclinic

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.DT_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token ${{ secrets.DT_API_TOKEN }}"
      OTEL_SERVICE_NAME: spring-petclinic-workflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install otel-cli
        run: |
          curl -sSL -o /usr/local/bin/otel-cli https://github.com/open-telemetry/opentelemetry-cli/releases/latest/download/otel-cli_linux_amd64
          chmod +x /usr/local/bin/otel-cli

      - name: Build Spring Petclinic
        run: |
          otel-cli exec --name build-app -- mvn clean package -DskipTests

      - name: Run Tests
        run: |
          otel-cli exec --name run-tests -- mvn test
