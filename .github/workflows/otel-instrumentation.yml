name: OTEL Instrumentation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-instrument:
    runs-on: ubuntu-latest

    env:
      OTEL_SERVICE_NAME: petclinic-workflow
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.DT_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token ${{ secrets.DT_API_TOKEN }}"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Spring Petclinic with OTEL agent
        run: |
          nohup java -javaagent:opentelemetry-javaagent.jar \
          -jar target/spring-petclinic-4.0.0-SNAPSHOT.jar > petclinic.log 2>&1 &
          echo $! > petclinic.pid
          sleep 30

      - name: Stop Spring Petclinic
        if: always()
        run: |
          if [ -f petclinic.pid ]; then
            kill $(cat petclinic.pid) || true
            rm petclinic.pid
          fi
