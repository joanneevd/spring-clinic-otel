name: Deploy and Test Cluster (2jobs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-cluster:
    runs-on: ubuntu-latest
    outputs:
      cluster-name: ${{ steps.create-cluster.outputs.cluster-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Kubernetes Cluster with Kind
        id: create-cluster
        uses: helm/kind-action@v1
        with:
          cluster-name: demo-cluster
        # bisa menambahkan output kalau perlu
        run: echo "::set-output name=cluster-name::demo-cluster"

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'

      - name: Deploy Applications
        run: |
          kubectl apply -f k8s/
          kubectl get pods -A

      - name: Wait for Pods Ready
        run: |
          kubectl wait --for=condition=ready pod -l app=demo-db --timeout=180s
          kubectl wait --for=condition=ready pod -l app=petclinic --timeout=180s

  test-application:
    runs-on: ubuntu-latest
    needs: deploy-cluster
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'

      - name: Run basic tests on app
        run: |
          kubectl get pods
          kubectl exec deploy/petclinic -- curl -s http://localhost:8080/actuator/health | grep UP

      - name: Run integration tests
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          pip install -r tests/requirements.txt
          pytest tests/integration/
